[package]
name = "lolstats"
version = "0.2.1"
edition = "2021"
description = "Ressourcensparender League-of-Legends-Begleiter (LCU) mit lokaler Statistik"
license = "MIT"
repository = "https://github.com/DavidDev25/lolstats-app"

[dependencies]
# SQLite wird mitkompiliert (bundled), keine Installation nötig
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# native-tls = SChannel unter Windows -> kein C-Compiler nötig
ureq = { version = "2.10", default-features = false, features = ["native-tls", "json"] }
native-tls = "0.2"
eframe = "0.29"
# nur PNG-Dekodierung für Item-/Champion-Bilder (ist über eframe ohnehin schon dabei)
image = { version = "0.25", default-features = false, features = ["png"] }
# Prüfsumme und Signatur der Updates (öffentliche Version), reines Rust
sha2 = "0.10"
ed25519-dalek = "2"
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
